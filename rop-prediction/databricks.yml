bundle:
  name: rop-prediction

variables:
  lakebase_instance:
    description: "Lakebase PostgreSQL instance name"
    default: drilling-demo-lakebase
  lakebase_database:
    description: "Lakebase database name"
    default: drilling_demo_app
  mlflow_model:
    description: "MLflow model name for ROP prediction"
    default: rop_xgb_mseel

resources:
  apps:
    rop-prediction:
      name: rop-prediction
      description: "ROP Prediction — Real-Time Drilling Optimization"
      source_code_path: .

      resources:
        - name: drilling-lakebase
          description: "Lakebase PostgreSQL for predictions and alerts"
          database:
            instance: ${var.lakebase_instance}

      env:
        - name: PGHOST
          value_from: drilling-lakebase
        - name: PGUSER
          value_from: drilling-lakebase
        - name: PGPORT
          value: "5432"
        - name: PGDATABASE_OVERRIDE
          value: ${var.lakebase_database}
        - name: MLFLOW_MODEL_NAME
          value: ${var.mlflow_model}

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://fevm-oil-pump-monitor.cloud.databricks.com
      profile: fe-vm-oil-pump-monitor

  prod:
    mode: production
    workspace:
      host: https://fevm-oil-pump-monitor.cloud.databricks.com
      profile: fe-vm-oil-pump-monitor
