command:
  - uvicorn
  - main:app
  - --host=0.0.0.0
  - --port=8000

env:
  - name: DATABRICKS_WAREHOUSE_ID
    value: "87e069097741b56c"
  - name: CLAUDE_MODEL
    value: "databricks-claude-sonnet-4-6"
  - name: VECTOR_SEARCH_ENDPOINT
    value: "subsea-manuals-vs"
  - name: VECTOR_SEARCH_INDEX
    value: "subsea.manuals.chunk_index"
  # Genie Space scoped to subsea gold tables — backs the Ask Genie tab.
  - name: GENIE_SPACE_ID
    value: "01f15581d82a151681fea1e888e0c2e7"
  # Foundation Model API endpoint for the CV-anomaly specialist + final synthesis.
  - name: AGENT_MODEL
    value: "databricks-claude-sonnet-4-6"
  # Unity Catalog target for UC Functions + Vector Search index used by Supervisor.
  - name: DEMO_CATALOG
    value: "oil_pump_monitor_catalog"
  - name: DEMO_SCHEMA
    value: "subsea"
  # Vector Search endpoint + index for the Mission-History specialist (falls back to
  # curated list if unset). Reuses the existing subsea-manuals-vs endpoint.
  - name: VS_ENDPOINT
    value: "subsea-manuals-vs"
  - name: VS_INDEX
    value: "oil_pump_monitor_catalog.subsea.mission_reports_vs_index"

resources:
  - name: subsea-lakebase
    lakebase:
      instance: subsea-drone-db
      database: subsea_ops
      permission: CAN_CONNECT_AND_CREATE
  - name: subsea-llm
    serving_endpoint: databricks-claude-sonnet-4-6
    permission: CAN_QUERY
  - name: subsea-warehouse
    sql_warehouse: 87e069097741b56c
    permission: CAN_USE
