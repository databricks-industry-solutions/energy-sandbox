command:
  - "python"
  - "-m"
  - "uvicorn"
  - "app:app"
  - "--host"
  - "0.0.0.0"
  - "--port"
  - "8000"

env:
  # Genie Space scoped to the LAS Viewer gold tables in Unity Catalog
  # (oil_pump_monitor_catalog.las_viewer: wells, depth_logs, curve_quality,
  # anomalies, processing_runs, formation_tops).
  - name: GENIE_SPACE_ID
    value: "01f1595064ca198a8cebb0b3982589d2"
  # Foundation Model API endpoint used by the existing AI advisor.
  - name: AGENT_MODEL
    value: "databricks-claude-sonnet-4-6"
  - name: DEMO_CATALOG
    value: "oil_pump_monitor_catalog"
  - name: DEMO_SCHEMA
    value: "las_viewer"
