command:
  - "python"
  - "-m"
  - "uvicorn"
  - "app:app"
  - "--host"
  - "0.0.0.0"
  - "--port"
  - "8000"

env:
  # Genie Space scoped to the LAS Viewer gold tables. Create a Genie Space first
  # (oil_pump_monitor_catalog.las_viewer schema covering wells, depth_logs,
  # curve_quality, anomalies, processing_runs, formation_tops), then set the ID.
  - name: GENIE_SPACE_ID
    value: ""
  # Foundation Model API endpoint used by the existing AI advisor.
  - name: AGENT_MODEL
    value: "databricks-claude-sonnet-4-6"
  - name: DEMO_CATALOG
    value: "oil_pump_monitor_catalog"
  - name: DEMO_SCHEMA
    value: "las_viewer"
