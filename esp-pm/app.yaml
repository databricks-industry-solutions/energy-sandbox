command:
  - "streamlit"
  - "run"
  - "app/main.py"
  - "--server.port=8000"
  - "--server.headless=true"
  - "--server.enableCORS=false"
  - "--server.enableXsrfProtection=false"

env:
  - name: THRESHOLD_HIGH
    value: "0.65"
  - name: THRESHOLD_MEDIUM
    value: "0.30"
  - name: DEFAULT_WINDOW_DAYS
    value: "7"
  - name: CLAUDE_MODEL
    value: "databricks-claude-sonnet-4-5"
  # ── Supervisor + Genie (multi-agent decision flow) ──────────────────────
  - name: AGENT_MODEL
    value: "databricks-claude-sonnet-4-5"
  - name: GENIE_SPACE_ID
    value: "01f1557d4c8215079d3ec0a8ef02c33b"
  - name: DEMO_CATALOG
    value: "oil_pump_monitor_catalog"
  - name: DEMO_SCHEMA
    value: "esp_pm"
  - name: ESP_FAILURE_MODEL
    value: "oil_pump_monitor_catalog.gold.esp_failure_72h_model"
  - name: ESP_FAILURE_MODEL_ALIAS
    value: "production"
  - name: ESP_FAILURE_ENDPOINT
    value: "esp-failure-72h"
  - name: ESP_VS_ENDPOINT
    value: "esp-failures-vs"
  - name: ESP_VS_INDEX
    value: "oil_pump_monitor_catalog.esp_pm.failure_narratives_vs"
  # ── Existing config ─────────────────────────────────────────────────────
  - name: DATABRICKS_WAREHOUSE_ID
    value: "87e069097741b56c"
  - name: PGUSER
    valueFrom: esp-pm-lakebase
  - name: PGPORT
    valueFrom: esp-pm-lakebase
  - name: PGDATABASE_OVERRIDE
    value: "esp_pm_app"

resources:
  - name: esp-pm-lakebase
    description: "Lakebase PostgreSQL for ESP PM alerts and work orders"
    database:
      instance_name: esp-pm-db
      database_name: esp_pm_app
      permission: CAN_CONNECT_AND_CREATE
