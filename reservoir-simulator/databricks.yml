bundle:
  name: reservoir-simulator

variables:
  warehouse_id:
    description: "SQL warehouse ID for the app"
    default: "87e069097741b56c"

resources:
  apps:
    reservoir-simulator:
      name: reservoir-simulator
      description: "Reservoir Simulator — Norne Field Digital Twin"
      source_code_path: .

      resources:
        - name: sql-warehouse
          description: "SQL warehouse for reading sim results from Unity Catalog"
          sql_warehouse:
            id: ${var.warehouse_id}
            permission: CAN_USE

      env:
        - name: DATABRICKS_WAREHOUSE_ID
          value_from: sql-warehouse

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://fevm-oil-pump-monitor.cloud.databricks.com
      profile: fe-vm-oil-pump-monitor

  prod:
    mode: production
    workspace:
      host: https://fevm-oil-pump-monitor.cloud.databricks.com
      profile: fe-vm-oil-pump-monitor
