# Copy to connector_runtime.yaml (or pass path from notebook) and fill secrets via Databricks secrets / env.
# Deploy: sync this repo to Databricks Repos (e.g. workspace adb-4173618801742158) and set paths below.
# Notebook ``00_smoke_test`` is connector-only (auth + API + extract); Delta uses this YAML elsewhere.

base_url: "https://admesbxscusins1.energy.azure.com"
data_partition_id: "opendes"

load_type: incremental  # full | incremental

auth:
  mode: managed_identity  # managed_identity | service_principal | static_token
  tenant_id: "72f988bf-86f1-41af-91ab-2d7cd011db47"
  adme_api_client_id: "e37a6c70-7cbc-4593-80fc-01c1f20203f7"
  managed_identity_client_id: null  # user-assigned MI client id, or null for system-assigned
  # service_principal_client_id: null
  # service_principal_client_secret: null
  # static_access_token: null

http:
  timeout_seconds: 60
  max_connections: 32

delta:
  # Unity Catalog + tables for pipelines / other notebooks (not used by ``00`` connector smoke).
  # Grants: ``USE CATALOG`` + ``CREATE SCHEMA`` on the catalog; Spark conf ``adme.connector.catalog`` if needed.
  # table_layout: unified — single bronze/silver/checkpoint tables (domain column on rows).
  # table_layout: per_domain — ``bronze_<domain>``, ``silver_<domain>``, ``checkpoint_<domain>`` (recommended for scale).
  table_layout: unified  # unified | per_domain
  catalog: "adme_adb_sbx_scus_dbx_ws_1"
  schema: "adme_osdu"
  bronze_table: "adme_osdu_bronze_records"
  silver_table: "adme_osdu_silver_records"
  checkpoint_table: "adme_osdu_ingest_checkpoint"
  # Governance mirror (Phase A) — legal tags, entitlements groups, ACL-style metadata
  legal_tags_table: "gov_legal_tags"
  entitlements_table: "gov_entitlements"
  record_acl_mirror_table: "gov_record_acl_mirror"

checkpoint:
  backend: delta  # delta | memory (memory for local unit tests only)
