name: CI — OSDU Connector Tests

on:
  push:
    branches: [main, "feat/**"]
    tags: ["osdu-connector/v*"]
  pull_request:
    branches: [main]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run self-contained federated auth proof
        run: python tests/test_federated_auth_proof.py

      - name: Run pytest suite
        run: python -m pytest tests/ -v --tb=short --junitxml=test-results.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-py${{ matrix.python-version }}
          path: test-results.xml

  coverage:
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests with coverage
        run: python -m pytest tests/ --cov=connector --cov-report=term-missing --cov-report=xml

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check imports resolve
        run: |
          pip install -r requirements.txt
          python -c "from connector.models.config import ConnectorRuntimeConfig; print('✓ config imports')"
          python -c "from connector.auth.providers import AuthProvider, build_credential; print('✓ auth imports')"
          python -c "from connector.schema.inferrer import SchemaInferrer; print('✓ schema imports')"
          python -c "from connector.schema.flattener import RecordFlattener; print('✓ flattener imports')"
          python -c "from connector.governance.parsers import parse_legal_tags_json; print('✓ governance imports')"
          python -c "from connector.storage.checkpoint import MemoryCheckpointStore; print('✓ checkpoint imports')"
          python -c "from connector.utils.uc_catalog import resolve_writable_catalog; print('✓ uc_catalog imports')"
