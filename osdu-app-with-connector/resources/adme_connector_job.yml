resources:
  jobs:
    adme_connector_pipeline:
      name: "[${bundle.target}] ADME OSDU Connector Pipeline"
      schedule:
        quartz_cron_expression: "0 0 6 * * ?"
        timezone_id: "UTC"
      email_notifications:
        on_failure:
          - gokul.pillai@databricks.com
      tasks:
        - task_key: smoke_test
          notebook_task:
            notebook_path: ../notebooks/00_smoke_test.py
            source: WORKSPACE
          existing_cluster_id: "0416-111252-i9szh29f"

        - task_key: run_all_domains
          depends_on:
            - task_key: smoke_test
          notebook_task:
            notebook_path: ../notebooks/02_run_all_domains.py
            source: WORKSPACE
          existing_cluster_id: "0416-111252-i9szh29f"

        - task_key: governance_sync
          depends_on:
            - task_key: run_all_domains
          notebook_task:
            notebook_path: ../notebooks/03_governance_sync.py
            source: WORKSPACE
          existing_cluster_id: "0416-111252-i9szh29f"
