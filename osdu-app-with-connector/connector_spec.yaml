# ADME OSDU Connector Spec
# Defines connection parameters for Unity Catalog and table-level external options.

display_name: Azure Data Manager for Energy (ADME OSDU)

# ============================================================================
# Connection Parameters
# Provided when creating the Unity Catalog connection object.
# ============================================================================
connection:
  parameters:
    - name: base_url
      type: string
      required: true
      description: >
        ADME instance base URL.
        Example: https://myinstance.energy.azure.com

    - name: data_partition_id
      type: string
      required: true
      description: >
        OSDU data partition identifier.
        Example: opendes

    - name: adme_api_client_id
      type: string
      required: true
      description: >
        Application (client) ID of the ADME API app registration in Azure AD.
        This is the audience for the OAuth2 token scope (api://<id>/.default).

    - name: tenant_id
      type: string
      required: true
      description: >
        Azure Active Directory (Entra ID) tenant ID.

    # ── Auth mode selection ──────────────────────────────────────────────────

    - name: auth_mode
      type: string
      required: false
      description: >
        Authentication mode. One of: managed_identity (default), service_principal,
        static_token, federated_identity.
        Defaults to managed_identity when running on Azure compute.

    # ── Managed Identity (default for Databricks clusters) ───────────────────

    - name: managed_identity_client_id
      type: string
      required: false
      description: >
        Client ID of a user-assigned Managed Identity. Omit for system-assigned MI.
        Only used when auth_mode=managed_identity.

    # ── Service Principal ────────────────────────────────────────────────────

    - name: service_principal_client_id
      type: string
      required: false
      description: >
        Azure AD application (client) ID for service principal auth.
        Required when auth_mode=service_principal or federated_identity.

    - name: service_principal_client_secret
      type: string
      required: false
      secret: true
      description: >
        Client secret for service principal auth.
        Required when auth_mode=service_principal.

    # ── Federated Identity (Workload Identity / OIDC) ────────────────────────

    - name: federated_token_file
      type: string
      required: false
      description: >
        Path to a file containing a federated assertion token (OIDC).
        Used when auth_mode=federated_identity.

    - name: federated_token
      type: string
      required: false
      secret: true
      description: >
        Inline federated assertion token (alternative to federated_token_file).

    # ── Static token (CI / testing) ──────────────────────────────────────────

    - name: access_token
      type: string
      required: false
      secret: true
      description: >
        Pre-issued bearer token. Use only for testing or CI pipelines.
        Requires auth_mode=static_token.

# ============================================================================
# External Options Allowlist
# Table-specific options passed via Unity Catalog externalOptionsAllowList.
# ============================================================================
external_options_allowlist: "page_size,load_type"

# page_size    — Override records per page (default: 100, max ADME allows: 1000)
# load_type    — "full" or "incremental" (overrides runtime config per table)
